name: Deploy to GitHub Pages

# Publishes the static site to the gh-pages branch on every push to main.
# The site is zero-build (vanilla JS/Canvas), so this just stages the web files
# and pushes them; GitHub Pages then serves the gh-pages branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # peaceiris needs this to push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stage only the files the browser needs, keeping gh-pages clean of dev
      # files (serve.mjs, CLAUDE.md, PROGRESS.md, workflows, etc.).
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          cp .nojekyll _site/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
