<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover exposes env(safe-area-inset-*) on notched devices -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#c99a5b" />
  <title>Rainforest</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- The play field is fit-scaled inside here; HUD anchors to the safe area. -->
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud" aria-hidden="true"></div>
    <pre id="debug" hidden></pre>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
